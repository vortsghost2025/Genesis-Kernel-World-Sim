services:
  genesis-viewer:
    # build context must be the world-sim directory (app + viewer + scripts)
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: genesis-viewer:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
