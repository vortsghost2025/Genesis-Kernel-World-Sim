<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis — Two Civilizations</title>
<style>
  :root {
    --bg: #06090f;
    --panel: rgba(13, 20, 30, 0.88);
    --line: #223245;
    --text: #eef4fb;
    --dim: #8fa1b6;
    --adam: #4ec3b0;
    --eve: #f5d04c;
    --accent: #ffd76d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }

  /* ---- cinematic stage ---- */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #stars { position: absolute; inset: 0; pointer-events: none; }
  #world { position: absolute; left: 50%; top: 45%; transition: transform 1.1s cubic-bezier(.45,.1,.2,1); will-change: transform; }

  .plate {
    position: absolute; width: 210px; height: 150px;
    border-radius: 46% 54% 52% 48% / 62% 58% 42% 58%;
    transform: translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 18px 34px rgba(0,0,0,0.55), inset 0 2px 0 rgba(255,255,255,0.08);
    transition: opacity .5s;
  }
  .plate .ticon { font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .plate .tname {
    margin-top: 6px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.75); text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .plate.dim { opacity: 0.16; }
  .plate.grass  { background: linear-gradient(160deg,#3a6a24,#1e3d10); }
  .plate.forest { background: linear-gradient(160deg,#1d4a2e,#0c2417); }
  .plate.hill   { background: linear-gradient(160deg,#6a5a33,#3a2f16); }
  .plate.mount  { background: linear-gradient(160deg,#5c6270,#2b3038); }
  .plate.coast  { background: linear-gradient(160deg,#20607c,#0e2c40); }
  .plate.ocean  { background: linear-gradient(160deg,#103348,#071c2c); }

  .pool {
    position: absolute; width: 560px; height: 560px; border-radius: 50%;
    transform: translate(-50%,-50%); pointer-events: none; filter: blur(6px);
    transition: left 1s cubic-bezier(.45,.1,.2,1), top 1s cubic-bezier(.45,.1,.2,1);
  }
  .pool.adam { background: radial-gradient(closest-side, rgba(78,195,176,0.32), rgba(78,195,176,0.08) 55%, transparent 75%); }
  .pool.eve  { background: radial-gradient(closest-side, rgba(245,208,76,0.30), rgba(245,208,76,0.08) 55%, transparent 75%); }

  .fig { position: absolute; transform: translate(-50%,-100%); text-align: center;
    transition: left 1s cubic-bezier(.45,.1,.2,1), top 1s cubic-bezier(.45,.1,.2,1); z-index: 5; }
  .fig .body {
    width: 34px; height: 44px; margin: 0 auto; border-radius: 16px 16px 10px 10px;
    background: linear-gradient(180deg,#eef3f8,#c5d0dc);
    box-shadow: 0 4px 12px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.6);
    position: relative;
  }
  .fig .head {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(180deg,#f6f9fc,#d4dde6);
    margin: -14px auto -4px; box-shadow: 0 3px 8px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.7);
  }
  .fig .core { position:absolute; left:50%; top:16px; width:8px; height:8px; border-radius:50%;
    transform:translateX(-50%); box-shadow: 0 0 10px 2px currentColor; }
  .fig .tag { margin-top: 6px; font-size: 14px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 2px 6px #000; }
  .fig.adam .core { background: var(--adam); color: var(--adam); }
  .fig.eve .core { background: var(--eve); color: var(--eve); }
  .fig.adam .tag { color: #baf3e7; } .fig.eve .tag { color: #ffe89a; }

  /* ---- caption (the show) ---- */
  #caption {
    position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%);
    max-width: 900px; min-width: 560px; text-align: center; z-index: 30;
    background: rgba(4,10,18,0.72); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 22px; backdrop-filter: blur(6px);
  }
  #caption .who { font-weight: 800; font-size: 1.05rem; margin-bottom: 2px; }
  #caption .txt { font-size: 1.1rem; line-height: 1.45; }
  #caption.adam { border-left: 6px solid var(--adam); }
  #caption.eve { border-left: 6px solid var(--eve); }
  #caption.neutral { border-left: 6px solid var(--line); }

  /* ---- control bar ---- */
  #bar {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; z-index: 31;
    background: var(--panel); border: 2px solid var(--line); border-radius: 16px;
    padding: 10px 16px; backdrop-filter: blur(8px);
  }
  button { background: #1c2938; color: var(--text); border: 2px solid var(--line);
    border-radius: 10px; padding: 8px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:hover, button:focus { border-color: var(--accent); }
  button.on { background: #4a3d12; border-color: var(--accent); color: var(--accent); }
  #scrubber { width: 340px; accent-color: var(--accent); height: 26px; }
  #hblabel { font-weight: 800; color: var(--accent); min-width: 90px; }

  /* ---- HUD ---- */
  #hud { position: fixed; top: 18px; left: 20px; z-index: 32; }
  #hud h1 { margin: 0 0 4px; font-size: 1.45rem; letter-spacing: 1px; }
  #hud .sub { color: var(--dim); font-size: 0.95rem; }
  #hud .tick { color: var(--accent); font-weight: 800; }
  #pairswitch { display: flex; gap: 8px; margin-top: 10px; }
  #pairswitch button { border-radius: 999px; font-size: 14px; padding: 6px 16px; }

  #viewmode { position: fixed; top: 18px; right: 20px; z-index: 32; display: flex; gap: 8px; }
  #feed {
    position: fixed; right: 20px; top: 70px; width: 380px; max-height: calc(100vh - 260px);
    overflow-y: auto; z-index: 29; padding: 10px 4px 10px 10px;
  }
  .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px; backdrop-filter: blur(5px); }
  .msg .who { font-weight: 800; margin-bottom: 3px; }
  .msg.adam { border-left: 5px solid var(--adam); } .msg.adam .who { color: #baf3e7; }
  .msg.eve { border-left: 5px solid var(--eve); } .msg.eve .who { color: #ffe89a; }
  .msg .body { font-size: 0.95rem; line-height: 1.4; }
  .event { color: var(--dim); font-style: italic; font-size: 0.9rem; padding: 3px 8px; }
  .event.gather { color: #9ece9e; font-style: normal; }
  .hb-head { color: var(--accent); font-weight: 800; margin: 12px 0 2px; font-size: 0.95rem; letter-spacing: 1px; }

  #tileinfo { position: fixed; right: 20px; bottom: 26px; width: 380px; z-index: 29;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 14px; backdrop-filter: blur(8px); max-height: 210px; overflow: auto; }
  #tileinfo h3 { margin: 0 0 6px; color: var(--accent); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="world"></div>
</div>

<div id="hud">
  <h1>GENESIS <span style="color:var(--dim);font-weight:400">— two civilizations on one young planet</span></h1>
  <div class="sub"><span class="tick" id="ticklabel">tick ?</span> · <span id="snaptime"></span></div>
  <div id="pairswitch"></div>
</div>

<div id="viewmode">
  <button id="viewCombined" class="on">Both</button>
  <button id="viewAdam">Adam's eyes</button>
  <button id="viewEve">Eve's eyes</button>
</div>

<div id="feed"></div>
<div id="caption" class="neutral"><div class="who"></div><div class="txt"></div></div>

<div id="bar">
  <button id="play">▶ Play</button>
  <input type="range" id="scrubber" min="1" max="1" value="1" step="1" aria-label="Heartbeat timeline">
  <span id="hblabel">hb ?</span>
</div>

<div id="tileinfo"><em>Click a tile.</em></div>

<script src="viewer_data.js"></script>
<script>
(function () {
  "use strict";
  if (!window.VIEWER_DATA) {
    document.getElementById("world").innerHTML = "<p style='padding:2em'>No data. Run scripts/export_viewer_snapshot.py first.</p>";
    return;
  }
  var ALL = window.VIEWER_DATA;
  var CELLX = 230, CELLY = 175;

  var TERRAIN = {
    grassland: { cls: "grass", icon: "🌾" },
    forest:    { cls: "forest", icon: "🌲" },
    hill:      { cls: "hill", icon: "⛰" },
    mountain:  { cls: "mount", icon: "🗻" },
    coast:     { cls: "coast", icon: "🌊" },
    ocean:     { cls: "ocean", icon: "≈" }
  };
  var LM_ICON = { river: "〰️", tree: "🌳", mountain_peak: "🏔", cove: "⚓",
                  rock_formation: "🪨", cliff_ledge: "🪨", meeting_stone: "🗿" };

  // starfield
  (function () {
    var stars = document.getElementById("stars"), html = "";
    var seed = 42;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    for (var i = 0; i < 200; i++) {
      var x = rnd() * 100, y = rnd() * 100, s = rnd() * 2.2 + 0.4, o = rnd() * 0.5 + 0.1;
      html += "<div style='position:absolute;left:" + x + "%;top:" + y + "%;width:" + s +
        "px;height:" + s + "px;border-radius:50%;background:#cfe2f8;opacity:" + o.toFixed(2) + "'></div>";
    }
    stars.innerHTML = html;
  })();

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  var state = { mode: "combined" };
  var C = null; // current pair context

  function init() {
    var sw = document.getElementById("pairswitch");
    Object.keys(ALL.pairs).forEach(function (pname, i) {
      var b = document.createElement("button");
      b.textContent = pname === "east"
        ? "EAST · the first pair"
        : "WEST · the dawn bluff";
      b.dataset.pair = pname;
      b.addEventListener("click", function () { loadPair(pname); });
      sw.appendChild(b);
    });
    var last = localStorage.getItem("genesis_cine_pair");
    loadPair(last && ALL.pairs[last] ? last : (ALL.pairs.west ? "west" : "east"));
  }

  function loadPair(pname) {
    localStorage.setItem("genesis_cine_pair", pname);
    Array.prototype.forEach.call(document.querySelectorAll("#pairswitch button"), function (b) {
      b.classList.toggle("on", b.dataset.pair === pname);
    });
    var world = document.getElementById("world");
    world.innerHTML = "";
    document.getElementById("feed").innerHTML = "";
    document.getElementById("tileinfo").innerHTML = "<em>Click a tile.</em>";

    var P = ALL.pairs[pname];

    document.getElementById("ticklabel").textContent = "tick " + P.exported_tick;
    document.getElementById("snaptime").textContent =
      "snapshot " + (P.exported_at_utc || "").replace("T", " ").slice(0, 19);

    // geography: this pair's home continent, touched tiles only
    var home = P.home_continent;
    var tiles = {}, lmByTile = {};
    ALL.true_map.tiles.forEach(function (t) {
      if (t.continent_id === home) tiles[t.tile_id] = t;
    });
    ALL.true_map.landmarks.forEach(function (l) {
      if (tiles[l.tile_id]) (lmByTile[l.tile_id] = lmByTile[l.tile_id] || []).push(l);
    });

    var xs = Object.values(tiles).map(function (t) { return t.coordinates.x; });
    var ys = Object.values(tiles).map(function (t) { return t.coordinates.y; });
    var minX = Math.min.apply(null, xs) - 1, maxX = Math.max.apply(null, xs) + 1;
    var minY = Math.min.apply(null, ys) - 1, maxY = Math.max.apply(null, ys) + 1;
    var cx0 = (minX + maxX) / 2, cy0 = (minY + maxY) / 2;

    function px(x) { return (x - cx0) * CELLX; }
    function py(y) { return (y - cy0) * CELLY; }

    // terrain plates
    Object.keys(tiles).forEach(function (id) {
      var t = tiles[id];
      var tr = TERRAIN[t.terrain] || TERRAIN.grassland;
      var d = document.createElement("div");
      d.className = "plate " + tr.cls;
      d.style.left = px(t.coordinates.x) + "px";
      d.style.top = py(t.coordinates.y) + "px";
      var lms = lmByTile[id] || [];
      var icon = lms.length ? (LM_ICON[lms[0].kind] || "★") : tr.icon;
      var regionName = (ALL.true_map.regions.find(function (r) { return r.region_id === t.region_id; }) || {}).name || "";
      d.innerHTML = "<div class='ticon'>" + icon + "</div><div class='tname'>" + esc(regionName || t.terrain) + "</div>";
      d.title = id;
      (function (tid) {
        d.addEventListener("click", function () { showTile(tid); });
      })(id);
      world.appendChild(d);
      t._el = d;
    });

    // light pools + figures
    var agents = P.agents.slice();
    var akey = {};
    agents.forEach(function (a) { akey[a] = a.indexOf("adam") >= 0 ? "adam" : "eve"; });
    var pools = {}, figs = {};
    agents.forEach(function (a) {
      var p = document.createElement("div");
      p.className = "pool " + akey[a];
      world.appendChild(p);
      pools[a] = p;
      var f = document.createElement("div");
      f.className = "fig " + akey[a];
      f.innerHTML = "<div class='head'></div><div class='body'><div class='core'></div></div><div class='tag'>" +
        (akey[a] === "adam" ? "ADAM" : "EVE") + "</div>";
      world.appendChild(f);
      figs[a] = f;
    });

    // known sets at final state (fog)
    var known = {};
    Object.keys(P.known_maps).forEach(function (a) {
      known[a] = {};
      Object.keys(P.known_maps[a].known_tiles || {}).forEach(function (t) { known[a][t] = true; });
    });

    var maxHb = 0;
    P.heartbeats.forEach(function (h) { if (h.heartbeat > maxHb) maxHb = h.heartbeat; });
    var scrub = document.getElementById("scrubber");
    scrub.max = maxHb; scrub.value = maxHb;

    function posAt(hb) {
      for (var h = hb; h >= 1; h--) if (P.position_timeline[String(h)]) return P.position_timeline[String(h)];
      return P.current_positions;
    }

    function render(hb) {
      document.getElementById("hblabel").textContent = "hb " + hb + " / " + maxHb;
      var pos = posAt(hb);
      var cxc = 0, cyc = 0, n = 0;
      agents.forEach(function (a) {
        var t = tiles[pos[a]];
        if (!t) return;
        var x = px(t.coordinates.x), y = py(t.coordinates.y);
        var shared = pos.east_adam === pos.east_eve || (agents.length === 2 && pos[agents[0]] === pos[agents[1]]);
        var off = shared ? (akey[a] === "adam" ? -30 : 30) : 0;
        figs[a].style.left = (x + off) + "px";
        figs[a].style.top = (y - 40) + "px";
        pools[a].style.left = x + "px";
        pools[a].style.top = y + "px";
        cxc += x; cyc += y; n++;
      });
      if (n) {
        var wx = cxc / n, wy = cyc / n;
        world.style.transform = "translate(" + (-wx) + "px," + (-wy) + "px)";
      }
      // fog
      Object.keys(tiles).forEach(function (id) {
        var vis = true;
        if (state.mode === "adam") vis = agents.some(function (a) { return akey[a] === "adam" && known[a][id]; });
        else if (state.mode === "eve") vis = agents.some(function (a) { return akey[a] === "eve" && known[a][id]; });
        tiles[id]._el.classList.toggle("dim", !vis);
      });
      // caption: latest action/message at this heartbeat
      var cap = document.getElementById("caption");
      var rec = null;
      for (var j = 0; j < P.heartbeats.length; j++) if (P.heartbeats[j].heartbeat === hb) rec = P.heartbeats[j];
      var msgs = P.public_messages.filter(function (m) { return m.heartbeat === hb; });
      var who = "", txt = "", cls = "neutral";
      if (msgs.length) {
        var m = msgs[msgs.length - 1];
        who = (m.sender === "adam" ? "Adam" : "Eve") + " says";
        txt = m.message;
        cls = m.sender === "adam" ? "adam" : "eve";
      } else if (rec) {
        var acts = [];
        Object.keys(rec.actions || {}).forEach(function (a) {
          var act = rec.actions[a];
          var who2 = akey[a] === "adam" ? "Adam" : "Eve";
          if (act.type === "move") acts.push(who2 + " walks to " + pretty(act.target_tile));
          else if (act.type === "gather") acts.push(who2 + " gathers " + (act.resource || "resources"));
          else if (act.type === "leave_public_message") acts.push(who2 + " speaks");
        });
        txt = acts.join(" · ");
        var firstA = Object.keys(rec.actions || {})[0];
        if (firstA) cls = akey[firstA] === "adam" ? "adam" : "eve";
      }
      if (txt) {
        cap.style.opacity = 1;
        cap.className = cls;
        cap.querySelector(".who").textContent = who;
        cap.querySelector(".txt").textContent = txt.length > 220 ? txt.slice(0, 217) + "…" : txt;
      } else {
        cap.style.opacity = 0;
      }
      renderFeed(hb);
    }

    function pretty(id) {
      if (!id) return "?";
      var region = (ALL.true_map.regions.find(function (r) {
        return r.region_id === (tiles[id] || {}).region_id; }) || {}).name;
      return region || id.replace(/^public-/, "").replace(/^west-/, "west ").replace("cont_a_", "A·").replace("cont_b_", "B·").replace(/_gen_/, "·").replace(/_/g, " ");
    }

    function renderFeed(hb) {
      var feed = document.getElementById("feed");
      var html = "";
      for (var h = Math.min(hb, maxHb); h >= 1; h--) {
        var rec = null;
        for (var j = 0; j < P.heartbeats.length; j++) if (P.heartbeats[j].heartbeat === h) rec = P.heartbeats[j];
        if (!rec) continue;
        var evs = [];
        Object.keys(rec.actions || {}).forEach(function (a) {
          var act = rec.actions[a];
          var who = akey[a] === "adam" ? "Adam" : "Eve";
          if (act.type === "move") evs.push("<div class='event'>" + who + " walks → " + esc(pretty(act.target_tile)) + "</div>");
          else if (act.type === "gather") evs.push("<div class='event gather'>" + who + " gathers " + esc(act.resource || "resources") + "</div>");
        });
        var msgs = P.public_messages.filter(function (m) { return m.heartbeat === h; });
        if (!evs.length && !msgs.length) continue;
        html += "<div class='hb-head'>HB " + h + "</div>" + evs.join("");
        msgs.forEach(function (m) {
          var isA = m.sender === "adam";
          html += "<div class='msg " + (isA ? "adam" : "eve") + "'><div class='who'>" +
            (isA ? "Adam" : "Eve") + " → " + ((m.recipient || "").indexOf("adam") >= 0 ? "Adam" : "Eve") +
            "</div><div class='body'>" + esc(m.message) + "</div></div>";
        });
      }
      feed.innerHTML = html || "<em>No activity yet.</em>";
    }

    function showTile(id) {
      var t = tiles[id]; if (!t) return;
      var lms = (lmByTile[id] || []).map(function (l) { return (LM_ICON[l.kind] || "★") + " " + esc(l.description || l.kind); });
      var visits = [];
      Object.keys(P.known_maps).forEach(function (a) {
        var k = P.known_maps[a].known_tiles[id];
        if (k) visits.push((akey[a] === "adam" ? "Adam" : "Eve") + " ×" + k.visit_count);
      });
      var region = (ALL.true_map.regions.find(function (r) { return r.region_id === t.region_id; }) || {}).name || "";
      document.getElementById("tileinfo").innerHTML =
        "<h3>" + esc(region || id) + "</h3>" +
        "<div>" + t.terrain + " · " + t.biome + (t.water ? " · " + t.water.type : "") + "</div>" +
        (lms.length ? "<div style='margin-top:6px'>" + lms.join("<br>") + "</div>" : "") +
        (visits.length ? "<div style='margin-top:6px;color:var(--dim)'>" + visits.join(" · ") + "</div>"
                       : "<div style='margin-top:6px;color:var(--dim)'>Not yet visited.</div>");
    }

    scrub.oninput = function () { render(+scrub.value); };
    document.getElementById("viewCombined").onclick = function () { setMode("combined"); };
    document.getElementById("viewAdam").onclick = function () { setMode("adam"); };
    document.getElementById("viewEve").onclick = function () { setMode("eve"); };
    function setMode(m) {
      state.mode = m;
      document.getElementById("viewCombined").classList.toggle("on", m === "combined");
      document.getElementById("viewAdam").classList.toggle("on", m === "adam");
      document.getElementById("viewEve").classList.toggle("on", m === "eve");
      render(+scrub.value);
    }

    var playing = null;
    document.getElementById("play").onclick = function () {
      var btn = this;
      if (playing) { clearInterval(playing); playing = null; btn.textContent = "▶ Play"; return; }
      if (+scrub.value >= maxHb) scrub.value = 1;
      btn.textContent = "⏸ Pause";
      playing = setInterval(function () {
        var v = +scrub.value + 1;
        if (v > maxHb) { clearInterval(playing); playing = null; btn.textContent = "▶ Play"; return; }
        scrub.value = v; render(v);
      }, 1400);
    };

    render(maxHb);
  }

  init();
})();
</script>
</body>
</html>
