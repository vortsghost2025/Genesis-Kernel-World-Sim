<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis — Two Civilizations</title>
<style>
  :root {
    --bg: #05080d; --panel: rgba(13, 20, 30, 0.88); --line: #223245;
    --text: #eef4fb; --dim: #8fa1b6;
    --adam: #4ec3b0; --eve: #f5d04c; --accent: #ffd76d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }

  #stage { position: fixed; inset: 0; overflow: hidden; }
  #stars { position: absolute; inset: 0; pointer-events: none; }
  #world { position: absolute; left: 50%; top: 50%; will-change: transform;
    transition: transform 1.2s cubic-bezier(.45,.08,.2,1); }

  #landscape, #foglayer { position: absolute; pointer-events: none;
    border-radius: 60px;
    box-shadow: 0 40px 120px rgba(0,0,0,0.75), 0 0 160px rgba(40,70,100,0.10); }
  #foglayer { filter: blur(3px); }
  .region-titles-on-plate { display: none; }
  .region-title { position: absolute; transform: translate(-50%,-50%); pointer-events: none;
    font-size: 76px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(255,255,255,0.09); white-space: nowrap; text-align: center; line-height: 1.1;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5); }

  .lmdiv { position: absolute; transform: translate(-50%,-60%); z-index: 4;
    pointer-events: auto; cursor: pointer; text-align: center; }
  .lmdiv .lm-ico { font-size: 40px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.8)); }
  .lmdiv .lm-name { font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,.85); text-shadow: 0 2px 5px #000; }

  .pool { position: absolute; width: 620px; height: 620px; border-radius: 50%;
    transform: translate(-50%,-50%); pointer-events: none; filter: blur(8px);
    transition: left 1s cubic-bezier(.45,.1,.2,1), top 1s cubic-bezier(.45,.1,.2,1); z-index: 2; }
  .pool.adam { background: radial-gradient(closest-side, rgba(78,195,176,0.30), rgba(78,195,176,0.07) 55%, transparent 75%); }
  .pool.eve  { background: radial-gradient(closest-side, rgba(245,208,76,0.28), rgba(245,208,76,0.07) 55%, transparent 75%); }

  .fig { position: absolute; transform: translate(-50%,-100%); text-align: center; z-index: 6;
    transition: left 1s cubic-bezier(.45,.1,.2,1), top 1s cubic-bezier(.45,.1,.2,1); }
  .fig .body { width: 40px; height: 52px; margin: 0 auto; border-radius: 19px 19px 12px 12px;
    background: linear-gradient(180deg,#f2f6fb,#c3cfdb);
    box-shadow: 0 6px 16px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.65); position: relative; }
  .fig .head { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(180deg,#f8fbfd,#d6dfe8);
    margin: -17px auto -5px; box-shadow: 0 3px 9px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.75); }
  .fig .core { position:absolute; left:50%; top:19px; width:9px; height:9px; border-radius:50%;
    transform:translateX(-50%); box-shadow: 0 0 14px 4px currentColor; }
  .fig .tag { margin-top: 8px; font-size: 17px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 8px #000; }
  .fig.adam .core { background: var(--adam); color: var(--adam); }
  .fig.eve .core { background: var(--eve); color: var(--eve); }
  .fig.adam .tag { color: #baf3e7; } .fig.eve .tag { color: #ffe89a; }
  .fig.dim { opacity: 0.35; filter: grayscale(0.6); }

  #caption { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%);
    max-width: 940px; min-width: 600px; text-align: center; z-index: 30;
    background: rgba(4,10,18,0.74); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px 26px; backdrop-filter: blur(8px); }
  #caption .who { font-weight: 900; font-size: 1.05rem; letter-spacing: 1.5px; margin-bottom: 3px; }
  #caption .txt { font-size: 1.25rem; line-height: 1.45; }
  #caption.adam { border-left: 7px solid var(--adam); }
  #caption.eve { border-left: 7px solid var(--eve); }
  #caption.neutral { border-left: 7px solid var(--line); }

  #bar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center; z-index: 31;
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
    padding: 10px 18px; backdrop-filter: blur(8px); }
  button { background: #1c2938; color: var(--text); border: 2px solid var(--line);
    border-radius: 10px; padding: 9px 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:hover, button:focus { border-color: var(--accent); }
  button.on { background: #4a3d12; border-color: var(--accent); color: var(--accent); }
  #scrubber { width: 380px; accent-color: var(--accent); height: 26px; }
  #hblabel { font-weight: 800; color: var(--accent); min-width: 100px; }

  #hud { position: fixed; top: 20px; left: 24px; z-index: 32; }
  #hud h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: 1px; }
  #hud .sub { color: var(--dim); font-size: 0.95rem; }
  #hud .tick { color: var(--accent); font-weight: 800; }
  #pairswitch { display: flex; gap: 8px; margin-top: 10px; }
  #pairswitch button { border-radius: 999px; font-size: 14px; padding: 6px 16px; }
  #viewmode { position: fixed; top: 20px; right: 24px; z-index: 32; display: flex; gap: 8px; }

  #feed { position: fixed; right: 24px; top: 68px; width: 360px; max-height: calc(100vh - 300px);
    overflow-y: auto; z-index: 29; padding: 8px 4px 8px 8px;
    mask-image: linear-gradient(180deg,#000 82%,transparent); }
  .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px; backdrop-filter: blur(5px); }
  .msg .who { font-weight: 800; margin-bottom: 3px; }
  .msg.adam { border-left: 5px solid var(--adam); } .msg.adam .who { color: #baf3e7; }
  .msg.eve { border-left: 5px solid var(--eve); } .msg.eve .who { color: #ffe89a; }
  .msg .body { font-size: 0.95rem; line-height: 1.42; }
  .event { color: var(--dim); font-style: italic; font-size: 0.9rem; padding: 3px 8px; }
  .event.gather { color: #a7d7a7; font-style: normal; }
  .hb-head { color: var(--accent); font-weight: 800; margin: 12px 0 2px; font-size: 0.92rem; letter-spacing: 1px; }

  #tileinfo { position: fixed; right: 24px; bottom: 24px; width: 360px; z-index: 29;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px 14px; backdrop-filter: blur(8px); max-height: 200px; overflow: auto; }
  #tileinfo h3 { margin: 0 0 6px; color: var(--accent); }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="world"></div>
</div>

<div id="hud">
  <h1>GENESIS <span style="color:var(--dim);font-weight:400;font-size:1rem">— two civilizations on one young planet</span></h1>
  <div class="sub"><span class="tick" id="ticklabel">tick ?</span> · <span id="snaptime"></span></div>
  <div id="pairswitch"></div>
</div>

<div id="viewmode">
  <button id="viewCombined" class="on">Both</button>
  <button id="viewAdam">Adam's eyes</button>
  <button id="viewEve">Eve's eyes</button>
</div>

<div id="feed"></div>
<div id="caption" class="neutral"><div class="who"></div><div class="txt"></div></div>

<div id="bar">
  <button id="play">▶ Play</button>
  <input type="range" id="scrubber" min="1" max="1" value="1" step="1" aria-label="Heartbeat timeline">
  <span id="hblabel">hb ?</span>
</div>

<div id="tileinfo"><em>Click a tile.</em></div>

<script src="viewer_data.js"></script>
<script>
(function () {
  "use strict";
  if (!window.VIEWER_DATA) {
    document.getElementById("world").innerHTML = "<p style='padding:2em'>No data.</p>";
    return;
  }
  var ALL = window.VIEWER_DATA;
  var CELLX = 240, CELLY = 185;

  var TERRAIN = {
    grassland: { cls: "grass", icon: "\u{1F33E}" },
    forest:    { cls: "forest", icon: "\u{1F332}" },
    hill:      { cls: "hill", icon: "\u{1F304}" },
    mountain:  { cls: "mount", icon: "\u{1F3D4}" },
    coast:     { cls: "coast", icon: "\u{1F3D6}" },
    ocean:     { cls: "ocean", icon: "\u{1F30A}" }
  };
  var LM_ICON = { river: "\u{1F4A7}", tree: "\u{1F333}", mountain_peak: "\u{1F3D4}",
                  cove: "\u{1F3D6}", rock_formation: "\u{1FAA8}", cliff_ledge: "\u{1FAA8}",
                  waterfall: "\u{1F4A7}", great_lake: "\u{1F4A7}", crater: "\u{1F311}",
                  cave_mouth: "\u{1F573}", glacier: "\u{1F9CA}", rift_escarpment: "\u{26F0}",
                  canyon: "\u{1F304}", meeting_stone: "\u{1F5FF}" };

  // deterministic pseudo-random per coordinate for organic plate shapes
  function hash01(x, y, s) {
    var h = 2166136261 ^ s;
    h = Math.imul(h ^ x, 16777619); h = Math.imul(h ^ y, 16777619);
    return ((h >>> 0) % 1000) / 1000;
  }

  (function stars() {
    var el = document.getElementById("stars"), html = "", seed = 42, i;
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    for (i = 0; i < 220; i++) {
      var s = rnd() * 2.4 + 0.4;
      html += "<div style='position:absolute;left:" + (rnd()*100) + "%;top:" + (rnd()*100) +
        "%;width:" + s + "px;height:" + s + "px;border-radius:50%;background:#cfe2f8;opacity:" +
        (rnd() * 0.5 + 0.08).toFixed(2) + "'></div>";
    }
    el.innerHTML = html;
  })();

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function tileRegionName(t) {
    return (ALL.true_map.regions.find(function (r) { return r.region_id === t.region_id; }) || {}).name || "";
  }
  function pretty(id, tiles) {
    var t = tiles[id];
    if (!t) return id;
    return tileRegionName(t) || id.replace(/^public-/, "").replace(/^west-/, "west ");
  }

  var state = { mode: "combined" };

  function init() {
    var sw = document.getElementById("pairswitch");
    Object.keys(ALL.pairs).forEach(function (pname) {
      var b = document.createElement("button");
      b.textContent = pname === "east" ? "EAST \u00B7 the first pair" : "WEST \u00B7 the dawn bluff";
      b.dataset.pair = pname;
      b.addEventListener("click", function () { loadPair(pname); });
      sw.appendChild(b);
    });
    var last = localStorage.getItem("genesis_cine_pair");
    loadPair(last && ALL.pairs[last] ? last : (ALL.pairs.west ? "west" : "east"));
  }

  function loadPair(pname) {
    localStorage.setItem("genesis_cine_pair", pname);
    Array.prototype.forEach.call(document.querySelectorAll("#pairswitch button"), function (b) {
      b.classList.toggle("on", b.dataset.pair === pname);
    });
    var world = document.getElementById("world");
    world.innerHTML = "";
    document.getElementById("feed").innerHTML = "";
    document.getElementById("tileinfo").innerHTML = "<em>Click a tile.</em>";

    var P = ALL.pairs[pname];
    document.getElementById("ticklabel").textContent = "tick " + P.exported_tick;
    document.getElementById("snaptime").textContent =
      "snapshot " + (P.exported_at_utc || "").replace("T", " ").slice(0, 19);

    var home = P.home_continent;
    var tiles = {}, lmByTile = {};
    ALL.true_map.tiles.forEach(function (t) { if (t.continent_id === home) tiles[t.tile_id] = t; });
    ALL.true_map.landmarks.forEach(function (l) {
      if (tiles[l.tile_id]) (lmByTile[l.tile_id] = lmByTile[l.tile_id] || []).push(l);
    });

    var xs = Object.values(tiles).map(function (t) { return t.coordinates.x; });
    var ys = Object.values(tiles).map(function (t) { return t.coordinates.y; });
    var cx0 = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
    var cy0 = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
    function px(x) { return (x - cx0) * CELLX; }
    function py(y) { return (y - cy0) * CELLY; }

    // ---- LANDSCAPE: paint the world as a continuous heightfield, not tiles ----
    // Build a canvas spanning the known geography. Each tile is a soft
    // radial splat of its terrain color at its elevation; splats overlap and
    // blur together into land. This is still tile-truth on the data layer;
    // the canvas only smooths the *look*.
    var gridMinX = Math.min.apply(null, Object.values(tiles).map(function (t) { return t.coordinates.x; }));
    var gridMaxX = Math.max.apply(null, Object.values(tiles).map(function (t) { return t.coordinates.x; }));
    var gridMinY = Math.min.apply(null, Object.values(tiles).map(function (t) { return t.coordinates.y; }));
    var gridMaxY = Math.max.apply(null, Object.values(tiles).map(function (t) { return t.coordinates.y; }));
    var cols = gridMaxX - gridMinX + 1, rows = gridMaxY - gridMinY + 1;
    var MARGIN = 260;
    var W = cols * CELLX + MARGIN * 2, H = rows * CELLY + MARGIN * 2;

    var canvas = document.createElement("canvas");
    canvas.id = "landscape";
    canvas.width = W; canvas.height = H;
    canvas.style.left = (px(gridMinX) - CELLX / 2 - MARGIN) + "px";
    canvas.style.top = (py(gridMinY) - CELLY / 2 - MARGIN) + "px";
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    world.appendChild(canvas);
    var ctx = canvas.getContext("2d");

    var TRC = {  // base colors (r,g,b)
      grassland: [68, 112, 38], forest: [28, 74, 46], hill: [110, 96, 58],
      mountain: [96, 102, 114], coast: [32, 96, 124], ocean: [16, 46, 68],
    };
    var tsh = {}; // tile center in canvas px
    Object.keys(tiles).forEach(function (id) {
      var t = tiles[id];
      tsh[id] = {
        x: (t.coordinates.x - gridMinX) * CELLX + MARGIN + CELLX / 2,
        y: (t.coordinates.y - gridMinY) * CELLY + MARGIN + CELLY / 2
      };
    });
    // soft lavender "known but not currently seen" wash + sea gradient
    var grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, "#0a1119"); grd.addColorStop(0.6, "#0d151f"); grd.addColorStop(1, "#0a121b");
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

    // known-region halo behind everything (the world they exist in)
    var knownAny = {};
    Object.keys(P.known_maps).forEach(function (a) {
      Object.keys(P.known_maps[a].known_tiles || {}).forEach(function (t) { knownAny[t] = true; });
    });

    Object.keys(tsh).forEach(function (id) {
      var t = tiles[id], p = tsh[id];
      var c = TRC[t.terrain] || TRC.grassland;
      var el = Math.max(0, Math.min(1, t.elevation || 0));
      var rr = Math.round(c[0] * (0.72 + el * 0.55)), gg = Math.round(c[1] * (0.72 + el * 0.55)), bb = Math.round(c[2] * (0.72 + el * 0.55));
      var rad = CELLX * 1.15;
      var g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
      g2.addColorStop(0, "rgba(" + rr + "," + gg + "," + bb + ",0.95)");
      g2.addColorStop(0.55, "rgba(" + rr + "," + gg + "," + bb + ",0.55)");
      g2.addColorStop(1, "rgba(" + rr + "," + gg + "," + bb + ",0)");
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 6.3); ctx.fill();
      // water sparkle
      if (t.water && t.water.type) {
        var wc = t.water.type === "sea" ? "rgba(30,80,120,0.8)" : "rgba(120,190,220,0.8)";
        var g3 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 0.6);
        g3.addColorStop(0, wc); g3.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g3;
        ctx.beginPath(); ctx.arc(p.x, p.y, rad * 0.6, 0, 6.3); ctx.fill();
      }
    });

    // blur pass to fuse splats into terrain
    var blurred = document.createElement("canvas");
    blurred.width = W; blurred.height = H;
    var bctx = blurred.getContext("2d");
    bctx.filter = "blur(26px) saturate(1.15)";
    bctx.drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(blurred, 0, 0);
    // re-draw the sky-side ground very faintly so edges read as shore
    ctx.globalCompositeOperation = "destination-over";
    ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";

    // ---- fog layer: a second canvas on top of the land -------------------
    fogCanvas = document.createElement("canvas");
    fogCanvas.id = "foglayer";
    fogCanvas.width = W; fogCanvas.height = H;
    fogCanvas.style.left = canvas.style.left;
    fogCanvas.style.top = canvas.style.top;
    fogCanvas.style.width = canvas.style.width;
    fogCanvas.style.height = canvas.style.height;
    fogCtx = fogCanvas.getContext("2d");
    world.appendChild(fogCanvas);

    // ---- region scene-setters stay, but ghosted over the land ----
    var byRegion = {};
    Object.keys(tiles).forEach(function (id) {
      var rn = tileRegionName(tiles[id]) || "The Wilds";
      (byRegion[rn] = byRegion[rn] || []).push(tiles[id]);
    });
    Object.keys(byRegion).forEach(function (rn) {
      var tset = byRegion[rn], rx = 0, ry = 0;
      tset.forEach(function (t) { rx += px(t.coordinates.x); ry += py(t.coordinates.y); });
      var d = document.createElement("div");
      d.className = "region-title";
      d.style.left = (rx / tset.length) + "px";
      d.style.top = (ry / tset.length) + "px";
      d.textContent = rn;
      d.style.color = "rgba(255,255,255,0.09)";
      d.style.zIndex = 3;
      world.appendChild(d);
    });

    // ---- landmarks as floating markers over the landscape ----
    Object.keys(tiles).forEach(function (id) {
      var lms = lmByTile[id] || [];
      if (!lms.length) return;
      var d = document.createElement("div");
      d.className = "lmdiv";
      d.style.left = px(tiles[id].coordinates.x) + "px";
      d.style.top = py(tiles[id].coordinates.y) + "px";
      var lm = lms[0];
      var name = (ALL.true_map.regions.find(function (r) { return r.region_id === tiles[id].region_id; }) || {}).name || "";
      d.innerHTML = "<div class='lm-ico'>" + (LM_ICON[lm.kind] || "\u2605") + "</div>" +
        "<div class='lm-name'>" + esc(name) + "</div>";
      (function (tid) { d.addEventListener("click", function (e) { e.stopPropagation(); showTile(tid); }); })(id);
      world.appendChild(d);
      (tiles[id]._lm = d);
    });

    // ---- pools + figures ----
    var agents = P.agents.slice();
    var akey = {};
    agents.forEach(function (a) { akey[a] = a.indexOf("adam") >= 0 ? "adam" : "eve"; });
    var pools = {}, figs = {};
    agents.forEach(function (a) {
      var p = document.createElement("div");
      p.className = "pool " + akey[a];
      world.appendChild(p); pools[a] = p;
      var f = document.createElement("div");
      f.className = "fig " + akey[a];
      f.innerHTML = "<div class='head'></div><div class='body'><div class='core'></div></div><div class='tag'>" +
        (akey[a] === "adam" ? "ADAM" : "EVE") + "</div>";
      world.appendChild(f); figs[a] = f;
    });

    var known = {};
    Object.keys(P.known_maps).forEach(function (a) {
      known[a] = {};
      Object.keys(P.known_maps[a].known_tiles || {}).forEach(function (t) { known[a][t] = true; });
    });

    var maxHb = 0;
    P.heartbeats.forEach(function (h) { if (h.heartbeat > maxHb) maxHb = h.heartbeat; });
    var scrub = document.getElementById("scrubber");
    scrub.max = maxHb; scrub.value = maxHb;

    function posAt(hb) {
      for (var h = hb; h >= 1; h--) if (P.position_timeline[String(h)]) return P.position_timeline[String(h)];
      return P.current_positions;
    }

    var ZOOM = 2.4;
    var fogCanvas = null, fogCtx = null;
    function render(hb) {
      document.getElementById("hblabel").textContent = "hb " + hb + " / " + maxHb;
      var pos = posAt(hb);
      var pts = [];
      var sameTile = false;
      agents.forEach(function (a) {
        var t = tiles[pos[a]]; if (!t) return;
        pts.push({ x: px(t.coordinates.x), y: py(t.coordinates.y), a: a, t: t });
      });
      if (pts.length === 2 && pts[0].t === pts[1].t) sameTile = true;
      pts.forEach(function (p, i) {
        var off = sameTile ? (i === 0 ? -44 : 44) : 0;
        figs[p.a].style.left = (p.x + off) + "px";
        figs[p.a].style.top = (p.y - 46) + "px";
        pools[p.a].style.left = p.x + "px";
        pools[p.a].style.top = p.y + "px";
      });
      if (pts.length) {
        var wx = pts.reduce(function (s, p) { return s + p.x; }, 0) / pts.length;
        var wy = pts.reduce(function (s, p) { return s + p.y; }, 0) / pts.length;
        var spread = 0;
        if (pts.length === 2) {
          var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
          spread = Math.sqrt(dx * dx + dy * dy);
        }
        var z = sameTile ? ZOOM + 0.7 : (spread > 500 ? ZOOM - 0.9 : ZOOM);
        world.style.transform = "translate(" + (-wx * z) + "px," + (-wy * z) + "px) scale(" + z + ")";
      }
      if (state.mode === "combined" || state.mode === "adam" || state.mode === "eve") {
        var fogged = {};
        var kk = state.mode === "combined" ? ["east_adam","east_eve","west_adam","west_eve"]
          : (state.mode === "adam" ? ["east_adam","west_adam"] : ["east_eve","west_eve"]);
        // build per-current-pair visibility
        var visibleNow = {};
        Object.keys(known).forEach(function(a) {
          if (kk.length === 0 || kk.indexOf(a) >= 0 || true) {
            if (state.mode === "combined" || akey[a] === state.mode) {
              Object.keys(known[a]).forEach(function(t2){ visibleNow[t2] = true; });
            }
          }
        });
        Object.keys(tiles).forEach(function (id) {
          var el = tiles[id]._lm;
          if (el) el.style.opacity = visibleNow[id] ? 1 : 0;
        });
        paintFog(visibleNow);
      }

    function paintFog(visibleSet) {
      if (!fogCtx) return;
      fogCtx.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
      var darkAll = Object.keys(visibleSet).length === 0;
      // base fog everywhere
      fogCtx.fillStyle = "rgba(3,7,12,0.82)";
      fogCtx.fillRect(0, 0, fogCanvas.width, fogCanvas.height);
      if (darkAll && state.mode === "combined") return;
      // cut out known land softly
      fogCtx.globalCompositeOperation = "destination-out";
      Object.keys(visibleSet).forEach(function (id) {
        var p = tsh[id]; if (!p) return;
        var radius = CELLX * 1.6;
        var g = fogCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius);
        g.addColorStop(0, "rgba(0,0,0,1)");
        g.addColorStop(0.5, "rgba(0,0,0,0.85)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        fogCtx.fillStyle = g;
        fogCtx.beginPath(); fogCtx.arc(p.x, p.y, radius, 0, 6.3); fogCtx.fill();
      });
      fogCtx.globalCompositeOperation = "source-over";
    }

      var cap = document.getElementById("caption");
      var rec = null, j;
      for (j = 0; j < P.heartbeats.length; j++) if (P.heartbeats[j].heartbeat === hb) rec = P.heartbeats[j];
      var msgs = P.public_messages.filter(function (m) { return m.heartbeat === hb; });
      var who = "", txt = "", cls = "neutral";
      if (msgs.length) {
        var m = msgs[msgs.length - 1];
        who = (m.sender === "adam" ? "Adam" : "Eve");
        txt = m.message;
        cls = m.sender === "adam" ? "adam" : "eve";
      } else if (rec) {
        var acts = [];
        Object.keys(rec.actions || {}).forEach(function (a) {
          var act = rec.actions[a], who2 = akey[a] === "adam" ? "Adam" : "Eve";
          if (act.type === "move") acts.push(who2 + " walks into " + pretty(act.target_tile, tiles));
          else if (act.type === "gather") acts.push(who2 + " gathers " + (act.resource || "resources"));
          else if (act.type === "leave_public_message") acts.push(who2 + " speaks");
        });
        txt = acts.join("  \u00b7  ");
      }
      if (txt) {
        cap.style.opacity = 1; cap.className = cls;
        cap.querySelector(".who").textContent = who;
        cap.querySelector(".txt").textContent = txt.length > 240 ? txt.slice(0, 237) + "\u2026" : txt;
      } else { cap.style.opacity = 0; }
      renderFeed(hb);
    }

    function renderFeed(hb) {
      var feed = document.getElementById("feed");
      var html = "";
      for (var h = Math.min(hb, maxHb); h >= 1; h--) {
        var rec = null, j;
        for (j = 0; j < P.heartbeats.length; j++) if (P.heartbeats[j].heartbeat === h) rec = P.heartbeats[j];
        if (!rec) continue;
        var evs = [];
        Object.keys(rec.actions || {}).forEach(function (a) {
          var act = rec.actions[a], who = akey[a] === "adam" ? "Adam" : "Eve";
          if (act.type === "move") evs.push("<div class='event'>" + who + " \u2192 " + esc(pretty(act.target_tile, tiles)) + "</div>");
          else if (act.type === "gather") evs.push("<div class='event gather'>" + who + " gathers " + esc(act.resource || "") + "</div>");
        });
        var msgs = P.public_messages.filter(function (m) { return m.heartbeat === h; });
        if (!evs.length && !msgs.length) continue;
        html += "<div class='hb-head'>HB " + h + "</div>" + evs.join("");
        msgs.forEach(function (m) {
          var isA = m.sender === "adam";
          html += "<div class='msg " + (isA ? "adam" : "eve") + "'><div class='who'>" +
            (isA ? "Adam" : "Eve") + " \u2192 " + ((m.recipient || "").indexOf("adam") >= 0 ? "Adam" : "Eve") +
            "</div><div class='body'>" + esc(m.message) + "</div></div>";
        });
      }
      feed.innerHTML = html || "<em>No activity yet.</em>";
    }

    function showTile(id) {
      var t = tiles[id]; if (!t) return;
      var lms = (lmByTile[id] || []).map(function (l) {
        return (LM_ICON[l.kind] || "\u2605") + " " + esc(l.description || l.kind); });
      var visits = [];
      Object.keys(P.known_maps).forEach(function (a) {
        var k = P.known_maps[a].known_tiles[id];
        if (k) visits.push((akey[a] === "adam" ? "Adam" : "Eve") + " \u00d7" + k.visit_count);
      });
      document.getElementById("tileinfo").innerHTML =
        "<h3>" + esc(tileRegionName(t) || "Uncharted") + "</h3>" +
        "<div>" + t.terrain + " \u00b7 " + t.biome + (t.water ? " \u00b7 " + t.water.type : "") + "</div>" +
        (lms.length ? "<div style='margin-top:6px'>" + lms.join("<br>") + "</div>" : "") +
        (visits.length ? "<div style='margin-top:6px;color:var(--dim)'>" + visits.join(" \u00b7 ") + "</div>"
                       : "<div style='margin-top:6px;color:var(--dim)'>Not yet visited.</div>");
    }

    scrub.oninput = function () { render(+scrub.value); };
    var modeBtns = { combined: "viewCombined", adam: "viewAdam", eve: "viewEve" };
    function setMode(m) {
      state.mode = m;
      Object.keys(modeBtns).forEach(function (k) {
        document.getElementById(modeBtns[k]).classList.toggle("on", k === m); });
      render(+scrub.value);
    }
    document.getElementById("viewCombined").onclick = function () { setMode("combined"); };
    document.getElementById("viewAdam").onclick = function () { setMode("adam"); };
    document.getElementById("viewEve").onclick = function () { setMode("eve"); };

    var playing = null;
    document.getElementById("play").onclick = function () {
      var btn = this;
      if (playing) { clearInterval(playing); playing = null; btn.textContent = "\u25B6 Play"; return; }
      if (+scrub.value >= maxHb) scrub.value = 1;
      btn.textContent = "\u23F8 Pause";
      playing = setInterval(function () {
        var v = +scrub.value + 1;
        if (v > maxHb) { clearInterval(playing); playing = null; btn.textContent = "\u25B6 Play"; return; }
        scrub.value = v; render(v);
      }, 1600);
    };

    render(maxHb);
  }

  init();
})();
</script>
</body>
</html>
