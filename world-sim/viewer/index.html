<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis — Two Civilizations</title>
<style>
:root {
  --bg: #0a0e14; --panel: rgba(15,20,28,.92); --line: #1a2a3a;
  --text: #dce4ee; --dim: #6b7f94; --accent: #e8b84b;
  --adam: #4ecdc4; --eve: #f7d05e;
  --water: #0d2137; --forest: #0d2818; --grass: #1a2818; --hill: #2a2418;
  --mountain: #2a1a14; --desert: #3a3018; --snow: #2a3040;
  --wall: #4a1010;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }
header .tick { color: var(--accent); font-weight: 800; }
header .sub { color: var(--dim); font-size: .85rem; }

#main { flex: 1; display: flex; overflow: hidden; }
#map-panel { flex: 1; position: relative; overflow: auto; }
#map-canvas { display: block; }
#sidebar { width: 380px; border-left: 1px solid var(--line); overflow-y: auto; flex-shrink: 0; background: var(--bg); }

#sidebar .section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
#sidebar h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); margin-bottom: 10px; }

.agent-card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; background: rgba(20,30,42,.6); border: 1px solid var(--line); }
.agent-card .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.agent-card.adam .dot { background: var(--adam); box-shadow: 0 0 8px var(--adam); }
.agent-card.eve .dot { background: var(--eve); box-shadow: 0 0 8px var(--eve); }
.agent-card .name { font-weight: 700; font-size: .95rem; }
.agent-card .pos { color: var(--dim); font-size: .8rem; }
.agent-card .inv { font-size: .78rem; color: var(--dim); }

.stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
.stat { background: rgba(20,30,42,.6); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.stat .num { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
.stat .label { font-size: .75rem; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }

.msg { padding: 10px 12px; margin-bottom: 8px; border-radius: 8px; background: rgba(20,30,42,.5); border-left: 3px solid var(--line); font-size: .88rem; line-height: 1.45; }
.msg.adam { border-left-color: var(--adam); }
.msg.eve { border-left-color: var(--eve); }
.msg .who { font-weight: 700; font-size: .8rem; margin-bottom: 3px; }
.msg .who.adam { color: var(--adam); }
.msg .who.eve { color: var(--eve); }
.msg .hb { color: var(--dim); font-size: .75rem; }

.obj-item { display: inline-flex; align-items: center; gap: 6px; background: rgba(20,30,42,.5); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; margin: 2px; font-size: .82rem; }
.obj-item .type { color: var(--accent); font-weight: 600; }

canvas { image-rendering: pixelated; }
#tooltip { position: fixed; z-index: 100; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: .82rem; pointer-events: none; display: none; max-width: 260px; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
</style>
</head>
<body>
<header>
  <div><h1>GENESIS</h1><div class="sub">Two Civilizations</div></div>
  <div style="text-align:right"><div class="tick" id="tick-label">—</div><div class="sub" id="clock">—</div></div>
</header>
<div id="main">
  <div id="map-panel"><canvas id="map-canvas"></canvas></div>
  <div id="sidebar">
    <div class="section"><h2>Agents</h2><div id="agents"></div></div>
    <div class="section"><h2>World</h2>
      <div class="stat-row" id="stats"></div>
    </div>
    <div class="section"><h2>Messages</h2><div id="messages"></div></div>
    <div class="section"><h2>Objects</h2><div id="objects"></div></div>
  </div>
</div>
<div id="tooltip"></div>
<script src="viewer_data.js"></script>
<script>
const D = window.VIEWER_DATA;
const PAIRS = D.pairs || {};
const TM = D.true_map || {};

// Build tile lookup from true_map
const tiles = {};
(TM.tiles || []).forEach(t => { tiles[t.tile_id] = t; });

// Terrain colors
const TERRAIN_COLORS = {
  ocean: '#0d2137', forest: '#0d2818', grassland: '#1a2818',
  hill: '#2a2418', mountain: '#2a1a14', desert: '#3a3018',
  snow: '#2a3040', coast: '#122a3a', river: '#1a3050',
  swamp: '#1a3020', tundra: '#202a35'
};

// Render world map
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');
const TILE_SIZE = 6;

function renderMap() {
  // Find tile bounds
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  Object.values(tiles).forEach(t => {
    const c = t.coordinates; if (!c) return;
    if (c.x < minX) minX = c.x; if (c.x > maxX) maxX = c.x;
    if (c.y < minY) minY = c.y; if (c.y > maxY) maxY = c.y;
  });
  const w = (maxX - minX + 1) * TILE_SIZE, h = (maxY - minY + 1) * TILE_SIZE;
  canvas.width = w; canvas.height = h;
  canvas.style.width = Math.min(w, 1200) + 'px';

  // Draw tiles
  Object.values(tiles).forEach(t => {
    const c = t.coordinates; if (!c) return;
    const px = (c.x - minX) * TILE_SIZE, py = (c.y - minY) * TILE_SIZE;
    const biome = t.biome || '';
    let color = TERRAIN_COLORS[biome] || '#1a1a2a';
    if (t.blocks_travel) color = 'var(--wall, #4a1010)';
    ctx.fillStyle = color;
    ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

    // Resources as tiny dots
    if (t.resources && t.resources.length > 0) {
      ctx.fillStyle = 'rgba(200,220,180,0.4)';
      ctx.fillRect(px+TILE_SIZE/4, py+TILE_SIZE/4, TILE_SIZE/2, TILE_SIZE/2);
    }
  });

  // Draw walls (blocked tiles get red overlay)
  Object.values(tiles).forEach(t => {
    if (!t.blocks_travel) return;
    const c = t.coordinates; if (!c) return;
    const px = (c.x - minX) * TILE_SIZE, py = (c.y - minY) * TILE_SIZE;
    ctx.fillStyle = 'rgba(180,40,40,0.35)';
    ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
  });

  // Draw objects
  for (const [pairName, pairData] of Object.entries(PAIRS)) {
    const objs = pairData.objects || {};
    Object.values(objs).forEach(o => {
      const tile = tiles[o.tile_id]; if (!tile) return;
      const c = tile.coordinates; if (!c) return;
      const px = (c.x - minX) * TILE_SIZE, py = (c.y - minY) * TILE_SIZE;
      ctx.fillStyle = pairName === 'east' ? 'rgba(78,205,196,0.8)' : 'rgba(247,208,94,0.8)';
      ctx.fillRect(px+1, py+1, TILE_SIZE-2, TILE_SIZE-2);
    });
  }
}

// Draw agents
function drawAgents() {
  for (const [pairName, pairData] of Object.entries(PAIRS)) {
    const color = pairName === 'east' ? '#4ecdc4' : '#f7d05e';
    for (const [ref, info] of Object.entries(pairData.agents || {})) {
      const tileId = info.tile_id || info.position;
      const tile = tiles[tileId]; if (!tile) continue;
      const c = tile.coordinates; if (!c) return;
      const px = (c.x - minX()) * TILE_SIZE + TILE_SIZE/2;
      const py = (c.y - minY()) * TILE_SIZE + TILE_SIZE/2;
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
      // Label
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px sans-serif';
      ctx.fillText(info.name || ref, px + 8, py + 4);
    }
  }
}

function minX() { let m=Infinity; Object.values(tiles).forEach(t=>{const c=t.coordinates;if(c&&c.x<m)m=c.x;}); return m; }
function minY() { let m=Infinity; Object.values(tiles).forEach(t=>{const c=t.coordinates;if(c&&c.y<m)m=c.y;}); return m; }

// Populate sidebar
function renderSidebar() {
  // Tick
  const tick = D.tick || 0;
  document.getElementById('tick-label').textContent = 'HB ' + tick.toLocaleString();
  document.getElementById('clock').textContent = D.generated_at ? new Date(D.generated_at).toLocaleString() : '';

  // Agents
  const agentsDiv = document.getElementById('agents');
  agentsDiv.innerHTML = '';
  for (const [pairName, pairData] of Object.entries(PAIRS)) {
    const color = pairName === 'east' ? 'var(--adam)' : 'var(--eve)';
    for (const [ref, info] of Object.entries(pairData.agents || {})) {
      const name = ref.split('_')[1] || ref;
      const tileId = info.tile_id || info.position || '?';
      const inv = info.inventory || {};
      const invStr = Object.entries(inv).filter(([k,v])=>v>0).map(([k,v])=>k+':'+v).join(', ') || 'empty';
      agentsDiv.innerHTML += `<div class="agent-card ${pairName === 'east' ? 'adam' : 'eve'}">
        <div class="dot"></div>
        <div><div class="name">${name} <span style="color:var(--dim);font-size:.75rem">(${pairName})</span></div>
        <div class="pos">${tileId}</div><div class="inv">${invStr}</div></div></div>`;
    }
  }

  // Stats
  let totalMsgs = 0, totalObjs = 0, totalHb = 0;
  for (const [pn, pd] of Object.entries(PAIRS)) {
    totalMsgs += (pd.messages || []).length;
    totalObjs += Object.keys(pd.objects || {}).length;
    totalHb = Math.max(totalHb, pd.tick || 0);
  }
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="num">${totalHb}</div><div class="label">Heartbeats</div></div>
    <div class="stat"><div class="num">${totalMsgs}</div><div class="label">Messages</div></div>
    <div class="stat"><div class="num">${totalObjs}</div><div class="label">Objects</div></div>`;

  // Messages (most recent first, all pairs)
  const msgDiv = document.getElementById('messages');
  msgDiv.innerHTML = '';
  let allMsgs = [];
  for (const [pn, pd] of Object.entries(PAIRS)) {
    for (const m of (pd.messages || []).slice(-30)) {
      allMsgs.push({...m, _pair: pn});
    }
  }
  allMsgs.sort((a,b) => (b.heartbeat||0) - (a.heartbeat||0));
  for (const m of allMsgs.slice(0, 15)) {
    const who = (m.sender_agent_id || '').split('_')[1] || m.sender_agent_id;
    const cls = m.sender_agent_id && m.sender_agent_id.includes('adam') ? 'adam' : 'eve';
    msgDiv.innerHTML += `<div class="msg ${cls}"><div class="who">${who || '?'} <span class="hb">HB${m.heartbeat}</span></div>${m.message || m.text || ''}</div>`;
  }
  if (!allMsgs.length) msgDiv.innerHTML = '<div style="color:var(--dim);font-size:.85rem">No messages yet.</div>';

  // Objects
  const objDiv = document.getElementById('objects');
  objDiv.innerHTML = '';
  let allObjs = [];
  for (const [pn, pd] of Object.entries(PAIRS)) {
    for (const [oid, o] of Object.entries(pd.objects || {})) {
      allObjs.push({...o, _pair: pn});
    }
  }
  // Group by type
  const byType = {};
  allObjs.forEach(o => { const t = o.object_type || '?'; byType[t] = (byType[t]||0)+1; });
  const typeStr = Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<span class="obj-item"><span class="type">${t}</span> ×${c}</span>`).join('');
  objDiv.innerHTML = typeStr || '<div style="color:var(--dim);font-size:.85rem">No objects yet.</div>';
}

// Render everything
renderMap();
renderSidebar();
drawAgents();

// Tooltip on hover
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left + document.getElementById('map-panel').scrollLeft;
  const my = e.clientY - rect.top + document.getElementById('map-panel').scrollTop;
  const tx = Math.floor(mx / TILE_SIZE) + minX();
  const ty = Math.floor(my / TILE_SIZE) + minY();
  const tid = `cont_a_gen_${tx}_${ty}`;
  const t = tiles[tid];
  const tip = document.getElementById('tooltip');
  if (t) {
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top = (e.clientY + 12) + 'px';
    tip.innerHTML = `<b>${tid}</b><br>${t.terrain} / ${t.biome}<br>${(t.resources||[]).join(', ') || 'no resources'}`;
  } else {
    tip.style.display = 'none';
  }
});
canvas.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.display = 'none'; });
</script>
</body>
</html>
