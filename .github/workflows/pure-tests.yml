name: Pure tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openai==2.24.0
          python -m pip install pytest-asyncio playwright cryptography
          python -m playwright install chromium
      - name: Run the pure test suite (whole tests/ except import-exit modules)
        run: |
          # The two legacy suites below call sys.exit(1) during module import,
          # which pytest treats as an INTERNALERROR and aborts collection for
          # the whole run regardless of --continue-on-collection-errors. They
          # are, and have always been, dead weight; excluding them is the only
          # way to get a real verdict from the rest.
          #   tests/test_canonical_gather_6g.py
          #   tests/test_gather_copy_6f.py
          #
          # This deliberately runs EVERY other test file. A curated subset
          # (what this workflow used to do) hid 34 failures for months while
          # per-phase commits reported green -- see docs/phase_index.md 10QB.
          python -m pytest tests/ -q \
            --continue-on-collection-errors \
            --ignore=tests/test_canonical_gather_6g.py \
            --ignore=tests/test_gather_copy_6f.py -v
