name: Pure tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: world-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openai==2.24.0
          python -m pip install pytest-asyncio playwright cryptography
          python -m playwright install chromium
      - name: Run the portable test subset
        run: |
          # WHY A SUBSET: running all ~200 test files was the right diagnostic
          # (it exposed 34 failures this subset had been hiding for months --
          # see docs/phase_index.md 10QB) but the wrong standing gate. Roughly
          # 30 suites are irreducibly tied to one Windows workstation: Windows
          # process creationflags, a TELEGRAM token in the operator's user
          # environment, gitignored live data (.runtime/, data/world/), the
          # built viewer artifact, and absolute C:\ paths. On a Linux runner
          # they fail or skip forever, and a permanently red CI is what you
          # stop reading. Those suites run locally via
          # scripts/run_full_suite.py; this gate runs what is portable.
          #
          # Explicitly excluded, with reason:
          #   test_canonical_gather_6f.py    sys.exit(1) at import aborts collection
          #   test_gather_copy_6f.py         sys.exit(1) at import aborts collection
          #   test_canonical_gather_6g.py    sys.exit(1) at import aborts collection
          #   test_executor_gather_validation_6h.py  same import-exit family
          #   test_observe_wiring_6c.py      same import-exit family
          #   test_rest_wiring_6e.py         same import-exit family
          #   test_canonical_heartbeat_runner.py     Windows creationflags
          #   test_spawn_windowless.py                Windows creationflags
          #   test_chain_watch.py                     operator user-env credentials
          #   test_streaming_count.py                 gitignored .runtime/ store
          #   test_lockstep_pair_filter.py            gitignored .runtime/ store
          #   test_operator_desk.py                   gitignored live store data
          #   test_steward_instance_lock.py           local lock-file semantics
          #   test_viewer_fidelity.py                 hardcoded operator temp path
          #   test_viewer_legibility.py               built viewer_data.js artifact
          #   test_viewer_prototype_scale.py          built viewer_data.js artifact
          python -m pytest tests/ -q \
            --continue-on-collection-errors \
            --ignore=tests/test_canonical_gather_6f.py \
            --ignore=tests/test_gather_copy_6f.py \
            --ignore=tests/test_canonical_gather_6g.py \
            --ignore=tests/test_executor_gather_validation_6h.py \
            --ignore=tests/test_observe_wiring_6c.py \
            --ignore=tests/test_rest_wiring_6e.py \
            --ignore=tests/test_canonical_heartbeat_runner.py \
            --ignore=tests/test_spawn_windowless.py \
            --ignore=tests/test_chain_watch.py \
            --ignore=tests/test_streaming_count.py \
            --ignore=tests/test_lockstep_pair_filter.py \
            --ignore=tests/test_operator_desk.py \
            --ignore=tests/test_steward_instance_lock.py \
            --ignore=tests/test_viewer_fidelity.py \
            --ignore=tests/test_viewer_legibility.py \
            --ignore=tests/test_viewer_prototype_scale.py -v
